name: Helm Charts

on:
  push:
    tags:
      - "v*"

jobs:
  helm_charts:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Helm
        uses: azure/setup-helm@18bc76811624f360dbd7f18c2d4ecb32c7b87bab # v1
        with:
          version: 'latest'

      - name: Package Helm Charts
        run: |
          mkdir helm-repo
          for dir in charts/*; do
            if [ -d "$dir" ] && [ -f "$dir/Chart.yaml" ]; then
              helm package "$dir" --destination helm-repo
            fi
          done

      - name: Fetch gh-pages branch
        run: |
          git fetch origin gh-pages:gh-pages
          git checkout gh-pages
          mv helm-repo/* .

      - name: Generate index.yaml
        run: |
          helm repo index . --url https://btech-software.github.io/agent-lab/ --merge index.yaml

      - name: Setup git config
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

      - name: Publish to gh-pages
        run: |
          git add .
          git commit -m "Update Helm chart repository"
          git push origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
